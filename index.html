<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Звънец</title>
<meta name="description" content="Програма, стаи и тестове на 10а и 10е · Пета езикова гимназия „Йоан Екзарх“, Варна">
<meta name="theme-color" content="#EDF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C121A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Звънец">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&family=Sofia+Sans+Semi+Condensed:wght@500;600;700&display=swap">
<style id="app-style">
:root{
  --bg:#EDF1F6;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#14213A;--ink-2:#3A4860;--muted:#66748A;--line:#D6DEE8;--line-2:#E6EBF1;
  --brand:#1B4F8A;--brand-ink:#FFFFFF;--brand-soft:#E1EAF6;
  --now:#C73A22;--now-soft:#FCEAE5;
  --test:#B4430C;--test-soft:#FDEBDC;--change:#6A3FC4;--change-soft:#EFE8FC;--event:#0D766A;--event-soft:#DDF2EE;--task:#8A5A00;--task-soft:#FBF0D6;--off:#556275;--off-soft:#E6EAF0;
  --err:#B42318;
  --shadow:0 1px 2px rgba(20,33,58,.06),0 6px 20px rgba(20,33,58,.07);
  --hero-bg:#163459;--hero-ink:#FFFFFF;--hero-muted:#A9BBD4;--hero-track:rgba(255,255,255,.13);--hero-seg:rgba(255,255,255,.34);--hero-accent:#FF8466;--hero-chip:rgba(255,255,255,.12);
  --hero-test:#FFB07A;--hero-change:#C9B2FF;--hero-event:#7FE0D2;--hero-task:#FFD479;--hero-off:#C5CFDC;
  --f-display:"Sofia Sans Extra Condensed","Sofia Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Sofia Sans Semi Condensed","Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0C121A;--surface:#131B26;--surface-2:#18212D;--ink:#E6EBF2;--ink-2:#BFC9D6;--muted:#8A97A9;--line:#243041;--line-2:#1C2634;
  --brand:#86B4EC;--brand-ink:#0C121A;--brand-soft:#192A40;
  --now:#FF7E62;--now-soft:#34201C;
  --test:#F7A05E;--test-soft:#382415;--change:#BBA0F7;--change-soft:#2A2140;--event:#5CCFBF;--event-soft:#123330;--task:#F0C35A;--task-soft:#33290F;--off:#9BA7B7;--off-soft:#202A37;
  --err:#FF8A7A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --hero-bg:#17283F;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0C121A;--surface:#131B26;--surface-2:#18212D;--ink:#E6EBF2;--ink-2:#BFC9D6;--muted:#8A97A9;--line:#243041;--line-2:#1C2634;
  --brand:#86B4EC;--brand-ink:#0C121A;--brand-soft:#192A40;
  --now:#FF7E62;--now-soft:#34201C;
  --test:#F7A05E;--test-soft:#382415;--change:#BBA0F7;--change-soft:#2A2140;--event:#5CCFBF;--event-soft:#123330;--task:#F0C35A;--task-soft:#33290F;--off:#9BA7B7;--off-soft:#202A37;
  --err:#FF8A7A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --hero-bg:#17283F;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--hero-bg);color:var(--hero-accent);display:grid;place-items:center;flex:none}
.brand-txt{min-width:0}
.brand-t{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:.95;letter-spacing:.01em}
.brand-s{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.top-r{display:flex;gap:6px;align-items:center;flex:none}
.cls-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 14px;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.cls-btn small{font-family:var(--f-ui);font-weight:600;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cls-btn svg{color:var(--muted)}
.cls-badge{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.cls-badge small{font-family:var(--f-ui);font-weight:600;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.t-bar.one{grid-template-columns:1fr}
.cls-seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.cls-pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--brand-soft);transition:transform .34s cubic-bezier(.34,1.3,.5,1);pointer-events:none}
.cls-o{position:relative;z-index:1;border:0;background:none;border-radius:999px;padding:4px 12px;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;color:var(--muted);min-width:48px}
.cls-o.on{color:var(--brand)}
.icon-b.edit{width:36px;height:36px;border-radius:999px;color:var(--brand)}
.icon-b.edit svg{width:18px;height:18px}
.link-btn{background:none;border:0;color:var(--brand);font-family:var(--f-ui);font-weight:600;font-size:14px;padding:8px 8px;border-radius:8px}
.link-btn.sm{font-size:13px;padding:4px 6px}
.icon-b{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:18px;line-height:1;color:var(--ink-2);flex:none}
.icon-b.armed{background:var(--now-soft);color:var(--now);border-color:var(--now)}
.pick-hint{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px 14px;border:1px dashed var(--brand);background:var(--brand-soft);color:var(--ink);border-radius:12px;font-family:var(--f-ui);font-size:14px;text-align:left}
.pick-hint b{color:var(--brand);white-space:nowrap}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.main,.side{min-width:0}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;display:grid;gap:14px;min-width:0;overflow:hidden}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.date{min-width:0}
.clock{font-family:var(--f-display);font-weight:800;font-size:clamp(60px,18vw,104px);line-height:.8;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.date{font-family:var(--f-ui);text-align:right;color:var(--hero-muted);font-size:14px;line-height:1.3;padding-bottom:2px}
.date b{display:block;color:var(--hero-ink);font-weight:700;font-size:18px}
.now-eb{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--hero-accent)}
.now-ti{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7.4vw,40px);line-height:1;text-wrap:balance;margin:4px 0 5px}
.now-me{color:var(--hero-muted);font-size:15px}
.now-me b{color:var(--hero-ink);font-weight:600}
.now-me .chg{color:var(--hero-change);font-weight:600}
.prog-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.progress{flex:1;height:5px;background:var(--hero-track);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--hero-accent);border-radius:5px}
.left{font-family:var(--f-ui);font-size:13.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.now-next{margin-top:8px;font-size:14px;color:var(--hero-muted)}
.now-next b{color:var(--hero-ink);font-weight:600}
.strip{position:relative;height:30px}
.sg{position:absolute;top:5px;bottom:5px;border-radius:5px;background:transparent;border:1px dashed var(--hero-track);display:grid;place-items:center;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--hero-muted)}
.sg.l{background:var(--hero-seg);border-color:transparent;color:var(--hero-ink)}
.sg.past{opacity:.45}
.sg.cur{background:var(--hero-accent);color:#1B1010;border-color:transparent;opacity:1}
.sg .dot{position:absolute;top:-4px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--hero-test);box-shadow:0 0 0 2px var(--hero-bg)}
.now-line{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--hero-ink);border-radius:2px}
.strip-lbl{display:flex;justify-content:space-between;gap:8px;margin-top:-6px;font-family:var(--f-ui);font-size:11.5px;color:var(--hero-muted);font-variant-numeric:tabular-nums}
.alerts{display:grid;gap:6px;border-top:1px solid var(--hero-track);padding-top:12px}
.alert{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.alert-h{font-family:var(--f-ui);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted)}
/* tags */
.tag{--tc:var(--test);--tb:var(--test-soft);--th:var(--hero-test);display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-weight:600;font-size:12px;line-height:1.2;padding:3px 8px;border-radius:999px;background:var(--tb);color:var(--tc);white-space:nowrap}
.t-change{--tc:var(--change);--tb:var(--change-soft);--th:var(--hero-change)}
.t-event{--tc:var(--event);--tb:var(--event-soft);--th:var(--hero-event)}
.t-task{--tc:var(--task);--tb:var(--task-soft);--th:var(--hero-task)}
.t-off{--tc:var(--off);--tb:var(--off-soft);--th:var(--hero-off)}
.hero .tag{background:var(--hero-chip);color:var(--hero-ink)}
.hero .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--th)}
.ex{font-family:var(--f-ui);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.sample{display:inline-block;font-family:var(--f-ui);font-size:11.5px;font-weight:600;color:var(--task);background:var(--task-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
/* headings */
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px;flex-wrap:wrap}
.h h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.005em}
.aside{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.side .h:first-child{margin-top:0}
@media (max-width:899px){.side .h:first-child{margin-top:22px}}
.wk{display:flex;align-items:center;gap:8px}
.wk-l{font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2);text-align:center;min-width:120px;font-variant-numeric:tabular-nums}
.wk-l small{display:block;color:var(--muted);font-size:11.5px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:7px 4px 5px;text-align:center;display:grid;justify-items:center;gap:0;position:relative}
.day b{font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:var(--muted)}
.day span{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.day .dd{height:6px;display:flex;gap:3px}
.day .dd em{width:6px;height:6px;border-radius:50%;background:var(--test)}
.day.today b{color:var(--now)}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.on b{color:inherit;opacity:.75}
.day.on.today b{color:var(--hero-accent);opacity:1}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 2px 8px;flex-wrap:wrap}
.day-h b{font-weight:700;font-size:16px}
.day-h span.sub{display:block;font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.day-ev{display:grid;gap:6px;margin-bottom:8px}
.day-ev .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px}
/* lessons */
.lessons{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ls{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2)}
.ls:first-child{border-top:0}
.ls-n b{display:block;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:.9}
.ls-n small{display:block;font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.25;margin-top:4px}
.ls-s{font-weight:600;font-size:16px;line-height:1.25}
.ls-t{font-size:13px;color:var(--muted);margin-top:1px}
.ls-note{font-size:13px;color:var(--ink-2);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.now-tag{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--now);text-transform:uppercase;align-self:center;margin-right:2px}
.room{display:grid;justify-items:center;min-width:60px;padding:5px 8px;border-radius:11px;background:var(--brand-soft);color:var(--brand);text-align:center}
.room small{font-family:var(--f-ui);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;opacity:.85}
.room b{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.room.txt b{font-family:var(--f-ui);font-size:13px;font-weight:700;line-height:1.2;max-width:84px}
.room.chg{background:var(--change-soft);color:var(--change)}
.ls.cur{background:var(--now-soft)}
.ls.cur .ls-n b{color:var(--now)}
.ls.past{opacity:.5}
.ls.free .ls-s{color:var(--muted);font-weight:500;font-size:14.5px}
.ls.free{padding-block:8px}
.ls.free .ls-n b{font-size:24px;color:var(--muted)}
.ls.cxl .ls-s{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14.5px;display:grid;gap:8px;justify-items:center}
/* upcoming */
.up{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.up-row,.ev-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line-2);align-items:start}
.up-row:first-child,.ev-row:first-child{border-top:0}
.up-d{text-align:center;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-2);padding:5px 0 4px}
.up-d b{display:block;font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1}
.up-d small{display:block;font-family:var(--f-ui);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.up-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up-s{font-weight:600;font-size:15px;margin-top:4px;line-height:1.3}
.up-w{font-size:13px;color:var(--muted);margin-top:2px}
.up-w b{color:var(--ink-2);font-weight:600}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);text-align:center}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,24,.5)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));cursor:default}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font-family:var(--f-display);font-weight:700;font-size:26px}
.hint{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin:4px 0 10px}
.grade{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.grade-n{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;min-width:50px}
.chip.sm{font-size:16px;min-width:42px;padding:4px 8px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
/* teacher */
.t-head{display:grid;gap:12px;margin-bottom:14px}
.t-title{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1}
.t-sub{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:4px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.panel+.panel{margin-top:14px}
.form-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.form-h h3{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-family:var(--f-ui);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
input::placeholder{color:var(--muted);opacity:.7}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--brand);flex:none}
.check{display:flex;align-items:center;gap:8px;font-size:14.5px;padding-top:18px}

<script>
(function(){
